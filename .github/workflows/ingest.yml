name: Weekly Intelligence Ingestion & Pipeline Validation

on:
  schedule:
    # Runs every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'templates/**'
      - 'tests/**'
      - 'requirements.txt'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "ingest-pipeline"
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Automated Pytest Suite
        run: |
          pytest tests/ -v

      - name: Run Intelligence Ingestion Pipeline
        run: |
          python src/pipeline.py

      - name: Commit Validated Intelligence Payloads & Docs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json docs/index.md src/data/sky_tib_latest.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated weekly intelligence ingestion & schema validation [skip ci]" && git push)
